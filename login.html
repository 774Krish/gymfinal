<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0c10">
  <title>Renewal Radar — Login</title>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0c10;
      --txt: #f1f3f7;
      --dim: #98a1b3;
      --line: rgba(255,255,255,.075);
      --line-2: rgba(255,255,255,.12);
      --surface: rgba(255,255,255,.032);
      --surface-2: rgba(255,255,255,.055);
      --surface-3: rgba(255,255,255,.085);
      --blue: #5b9dff;
      --blue-soft: #9cc4ff;
      --red: #f0555f;
      --input-bg: rgba(0,0,0,.28);
      --input-bg-focus: rgba(0,0,0,.36);
      --btn-shadow: inset 0 1px 0 rgba(255,255,255,.055), 0 1px 2px rgba(0,0,0,.25);
      --glow-1: rgba(91,157,255,.13);
      --glow-2: rgba(167,139,250,.11);
      --glow-3: rgba(61,220,132,.05);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f2f4f8;
      --txt: #10141c;
      --dim: #525c6e;
      --line: rgba(15,20,30,.10);
      --line-2: rgba(15,20,30,.18);
      --surface: rgba(15,20,30,.03);
      --surface-2: rgba(15,20,30,.045);
      --surface-3: rgba(15,20,30,.075);
      --blue: #2563eb;
      --blue-soft: #1a4fc4;
      --red: #d92d3a;
      --input-bg: #ffffff;
      --input-bg-focus: #ffffff;
      --btn-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(15,20,30,.07);
      --glow-1: rgba(91,157,255,.16);
      --glow-2: rgba(167,139,250,.14);
      --glow-3: rgba(61,220,132,.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      color: var(--txt);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: var(--bg);
      background-image:
        radial-gradient(720px 420px at 12% -8%, var(--glow-1), transparent 70%),
        radial-gradient(680px 400px at 92% -4%, var(--glow-2), transparent 68%),
        radial-gradient(900px 520px at 50% 108%, var(--glow-3), transparent 72%);
      background-attachment: fixed;
    }

    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
      box-shadow: 0 6px 20px -6px rgba(0,0,0,.55);
    }

    .auth-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .auth-logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 19px;
      background: linear-gradient(150deg, #5b9dff, #a78bfa 62%, #f0555f 130%);
      box-shadow: 0 6px 18px -6px rgba(91,157,255,.7), inset 0 1px 0 rgba(255,255,255,.35);
    }

    .auth-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 680;
      letter-spacing: -0.024em;
    }

    .auth-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--dim);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--txt);
      font-size: 15px;
      font-family: inherit;
      transition: background 0.18s, border-color 0.18s;
    }

    .form-group input:focus {
      outline: none;
      background: var(--input-bg-focus);
      border-color: var(--blue);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .auth-button {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(150deg, var(--blue), #a78bfa);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: transform 0.14s, opacity 0.18s;
      margin-top: 8px;
    }

    .auth-button:hover {
      opacity: 0.9;
    }

    .auth-button:active {
      transform: scale(0.99);
    }

    .auth-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toggle-auth {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--dim);
    }

    .toggle-auth a {
      color: var(--blue);
      text-decoration: none;
      cursor: pointer;
    }

    .toggle-auth a:hover {
      text-decoration: underline;
    }

    .error-message {
      padding: 12px;
      border-radius: 8px;
      background: rgba(240,85,95,.12);
      border: 1px solid rgba(240,85,95,.32);
      color: #ff8a92;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--dim);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0;
    }

    .theme-toggle:hover {
      background: var(--surface-3);
    }

    .theme-toggle svg {
      width: 17px;
      height: 17px;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    [data-theme="light"] .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">📊</div>
        <h1>Renewal Radar</h1>
      </div>

      <div id="loginForm">
        <div class="auth-title">Welcome Back</div>
        <div class="auth-subtitle">Sign in to manage your gym members</div>

        <div id="loginError" class="error-message"></div>

        <form id="loginFormElement" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="auth-button">Sign In</button>
        </form>

        <div class="toggle-auth">
          Don't have an account? <a onclick="switchToSignup()">Sign up</a>
        </div>
        <div class="toggle-auth" style="margin-top: 6px;">
          <a onclick="showForgot()" style="font-size: 13px;">Forgot password?</a>
        </div>
      </div>

      <div id="signupForm" style="display: none;">
        <div class="auth-title">Create Account</div>
        <div class="auth-subtitle">Join Renewal Radar to manage your gym</div>

        <div id="signupError" class="error-message"></div>

        <form id="signupFormElement" onsubmit="handleSignup(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="signupFirstName">First Name</label>
              <input type="text" id="signupFirstName" placeholder="John" required autocomplete="given-name">
            </div>
            <div class="form-group">
              <label for="signupLastName">Last Name</label>
              <input type="text" id="signupLastName" placeholder="Doe" autocomplete="family-name">
            </div>
          </div>
          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="••••••••" required autocomplete="new-password">
          </div>
          <button type="submit" class="auth-button">Create Account</button>
        </form>

        <div class="toggle-auth">
          Already have an account? <a onclick="switchToLogin()">Sign in</a>
        </div>
      </div>

      <div id="forgotForm" style="display: none;">
        <div class="auth-title">Reset Password</div>
        <div class="auth-subtitle">Enter your email and we'll send you a reset link</div>

        <div id="forgotError" class="error-message"></div>
        <div id="forgotSuccess" class="error-message" style="background: rgba(61,220,132,.12); border-color: rgba(61,220,132,.32); color: #7ceea9;"></div>

        <form id="forgotFormElement" onsubmit="handleForgotPassword(event)">
          <div class="form-group">
            <label for="forgotEmail">Email</label>
            <input type="email" id="forgotEmail" placeholder="you@example.com" required autocomplete="email">
          </div>
          <button type="submit" class="auth-button">Send Reset Link</button>
        </form>

        <div class="toggle-auth">
          <a onclick="switchToLogin()">← Back to sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="frontend.js"></script>
  <script>
    // Theme toggle
    function setupTheme() {
      let theme = localStorage.getItem('rr_theme');
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);

      document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('rr_theme', next);
      });
    }

    function showError(fieldId, message) {
      const errorEl = document.getElementById(fieldId);
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function clearError(fieldId) {
      const errorEl = document.getElementById(fieldId);
      errorEl.textContent = '';
      errorEl.classList.remove('show');
    }

    async function handleLogin(event) {
      event.preventDefault();
      clearError('loginError');

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = event.target.querySelector('button');

      btn.disabled = true;
      btn.classList.add('loading');

      try {
        await api.login(email, password);
        window.location.href = '/gym-select.html';
      } catch (err) {
        showError('loginError', err.message);
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    async function handleSignup(event) {
      event.preventDefault();
      clearError('signupError');

      const firstName = document.getElementById('signupFirstName').value;
      const lastName = document.getElementById('signupLastName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const btn = event.target.querySelector('button');

      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const result = await api.signup(email, password, firstName, lastName);
        
        if (result.needsVerification) {
          // Show verification info
          showError('signupError', `✅ Account created! Check your email for a verification link or go to <a href="/verify-email.html?token=${result.verificationToken}" style="color: inherit; text-decoration: underline;">verify email</a>`);
          document.querySelector('#signupError').innerHTML = `✅ Account created! Check your email for a verification link or <a href="/verify-email.html?token=${result.verificationToken}" style="color: #9cc4ff; text-decoration: underline; cursor: pointer;">verify now</a>`;
          // Clear form
          document.getElementById('signupFormElement').reset();
          btn.disabled = false;
          btn.classList.remove('loading');
        } else {
          window.location.href = '/gym-select.html';
        }
      } catch (err) {
        showError('signupError', err.message);
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    function switchToSignup() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'block';
      document.getElementById('forgotForm').style.display = 'none';
    }

    function switchToLogin() {
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('forgotForm').style.display = 'none';
    }

    function showForgot() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('forgotForm').style.display = 'block';
      document.getElementById('forgotError').classList.remove('show');
      document.getElementById('forgotSuccess').classList.remove('show');
    }

    async function handleForgotPassword(event) {
      event.preventDefault();
      const errorEl = document.getElementById('forgotError');
      const successEl = document.getElementById('forgotSuccess');
      errorEl.classList.remove('show');
      successEl.classList.remove('show');

      const email = document.getElementById('forgotEmail').value;
      const btn = event.target.querySelector('button');

      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const result = await api.forgotPassword(email);
        successEl.textContent = result.message || 'If that email is registered, a reset link has been sent.';
        successEl.classList.add('show');
        document.getElementById('forgotFormElement').reset();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    // Check if already logged in
    if (api.token) {
      window.location.href = '/gym-select.html';
    }

    setupTheme();
  </script>
</body>
</html>
