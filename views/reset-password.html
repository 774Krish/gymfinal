<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0c10">
  <title>Renewal Radar — Reset Password</title>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0c10;
      --txt: #f1f3f7;
      --dim: #98a1b3;
      --line: rgba(255,255,255,.075);
      --surface: rgba(255,255,255,.032);
      --surface-2: rgba(255,255,255,.055);
      --blue: #5b9dff;
      --green: #3ddc84;
      --red: #f0555f;
      --input-bg: rgba(0,0,0,.28);
      --glow-1: rgba(91,157,255,.13);
      --glow-2: rgba(167,139,250,.11);
      --glow-3: rgba(61,220,132,.05);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f2f4f8;
      --txt: #10141c;
      --dim: #525c6e;
      --line: rgba(15,20,30,.10);
      --surface: rgba(15,20,30,.03);
      --surface-2: rgba(15,20,30,.045);
      --blue: #2563eb;
      --green: #0f9250;
      --red: #d92d3a;
      --input-bg: #ffffff;
      --glow-1: rgba(91,157,255,.16);
      --glow-2: rgba(167,139,250,.14);
      --glow-3: rgba(61,220,132,.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      color: var(--txt);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: var(--bg);
      background-image:
        radial-gradient(720px 420px at 12% -8%, var(--glow-1), transparent 70%),
        radial-gradient(680px 400px at 92% -4%, var(--glow-2), transparent 68%),
        radial-gradient(900px 520px at 50% 108%, var(--glow-3), transparent 72%);
      background-attachment: fixed;
    }

    .reset-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .reset-card {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
      box-shadow: 0 6px 20px -6px rgba(0,0,0,.55);
      text-align: center;
    }

    .reset-icon {
      font-size: 44px;
      margin-bottom: 18px;
    }

    .reset-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: var(--txt);
    }

    .reset-subtitle {
      font-size: 14px;
      color: var(--dim);
      margin: 0 0 26px 0;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--txt);
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.18s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .reset-button {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(150deg, var(--blue), #a78bfa);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.14s, opacity 0.18s;
      margin-top: 6px;
      margin-bottom: 12px;
    }

    .reset-button:hover { opacity: 0.9; }
    .reset-button:active { transform: scale(0.99); }
    .reset-button:disabled { opacity: 0.5; cursor: not-allowed; }

    .reset-link {
      font-size: 13px;
      color: var(--blue);
      text-decoration: none;
      cursor: pointer;
    }

    .reset-link:hover { text-decoration: underline; }

    .error-message, .success-message {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: left;
      line-height: 1.5;
    }

    .error-message {
      background: rgba(240,85,95,.12);
      border: 1px solid rgba(240,85,95,.32);
      color: #ff8a92;
    }

    .success-message {
      background: rgba(61,220,132,.11);
      border: 1px solid rgba(61,220,132,.30);
      color: #7ceea9;
    }

    .error-message.show, .success-message.show { display: block; }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--dim);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0;
    }

    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    [data-theme="light"] .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }

    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-icon">🔐</div>
      <h1 class="reset-title">Reset Password</h1>
      <p class="reset-subtitle">Enter a new password for your account</p>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <div id="resetForm">
        <form id="resetFormElement" onsubmit="handleResetPassword(event)">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="At least 6 characters" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password">
          </div>
          <button type="submit" class="reset-button">Reset Password</button>
        </form>
      </div>

      <div id="completedMessage" style="display: none; text-align: center;">
        <div style="font-size: 44px; margin-bottom: 12px;">✅</div>
        <p style="color: var(--green); font-weight: 600; margin: 0 0 12px 0;">Password reset!</p>
        <p style="color: var(--dim); margin: 0 0 16px 0;">Redirecting to sign in...</p>
      </div>

      <div style="text-align: center; font-size: 13px; color: var(--dim);">
        <a href="/login" class="reset-link">← Back to login</a>
      </div>
    </div>
  </div>

  <script src="frontend.js"></script>
  <script>
    // Theme toggle
    function setupTheme() {
      let theme = localStorage.getItem('rr_theme');
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);

      document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('rr_theme', next);
      });
    }

    function getTokenFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token') || '';
    }

    async function handleResetPassword(event) {
      event.preventDefault();

      const token = getTokenFromURL();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorEl = document.getElementById('errorMessage');
      const btn = event.target.querySelector('button');

      errorEl.classList.remove('show');

      if (!token) {
        errorEl.textContent = 'Missing reset link. Please request a new password reset.';
        errorEl.classList.add('show');
        return;
      }

      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');

      try {
        await api.resetPassword(token, newPassword);
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('completedMessage').style.display = 'block';

        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    setupTheme();
  </script>
</body>
</html>
