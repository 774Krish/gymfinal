<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0c10">
  <title>Renewal Radar — Verify Email</title>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0c10;
      --txt: #f1f3f7;
      --dim: #98a1b3;
      --line: rgba(255,255,255,.075);
      --surface: rgba(255,255,255,.032);
      --surface-2: rgba(255,255,255,.055);
      --blue: #5b9dff;
      --green: #3ddc84;
      --red: #f0555f;
      --glow-1: rgba(91,157,255,.13);
      --glow-2: rgba(167,139,250,.11);
      --glow-3: rgba(61,220,132,.05);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f2f4f8;
      --txt: #10141c;
      --dim: #525c6e;
      --line: rgba(15,20,30,.10);
      --surface: rgba(15,20,30,.03);
      --surface-2: rgba(15,20,30,.045);
      --blue: #2563eb;
      --green: #0f9250;
      --red: #d92d3a;
      --glow-1: rgba(91,157,255,.16);
      --glow-2: rgba(167,139,250,.14);
      --glow-3: rgba(61,220,132,.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      color: var(--txt);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: var(--bg);
      background-image:
        radial-gradient(720px 420px at 12% -8%, var(--glow-1), transparent 70%),
        radial-gradient(680px 400px at 92% -4%, var(--glow-2), transparent 68%),
        radial-gradient(900px 520px at 50% 108%, var(--glow-3), transparent 72%);
      background-attachment: fixed;
    }

    .verify-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .verify-card {
      width: 100%;
      max-width: 480px;
      padding: 40px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
      box-shadow: 0 6px 20px -6px rgba(0,0,0,.55);
      text-align: center;
    }

    .verify-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .verify-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px 0;
      color: var(--txt);
    }

    .verify-subtitle {
      font-size: 14px;
      color: var(--dim);
      margin: 0 0 28px 0;
      line-height: 1.6;
    }

    .verify-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0,0,0,.28);
      color: var(--txt);
      font-size: 14px;
      font-family: "Courier New", monospace;
      margin-bottom: 16px;
      transition: border-color 0.18s;
    }

    .verify-input:focus {
      outline: none;
      border-color: var(--blue);
    }

    .verify-button {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(150deg, var(--blue), #a78bfa);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.14s, opacity 0.18s;
      margin-bottom: 12px;
    }

    .verify-button:hover {
      opacity: 0.9;
    }

    .verify-button:active {
      transform: scale(0.99);
    }

    .verify-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .verify-link {
      font-size: 13px;
      color: var(--blue);
      text-decoration: none;
      cursor: pointer;
    }

    .verify-link:hover {
      text-decoration: underline;
    }

    .error-message, .success-message, .info-message {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error-message {
      background: rgba(240,85,95,.12);
      border: 1px solid rgba(240,85,95,.32);
      color: #ff8a92;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(61,220,132,.11);
      border: 1px solid rgba(61,220,132,.30);
      color: #7ceea9;
    }

    .success-message.show {
      display: block;
    }

    .info-message {
      background: rgba(91,157,255,.12);
      border: 1px solid rgba(91,157,255,.32);
      color: #9cc4ff;
      line-height: 1.6;
    }

    .info-message.show {
      display: block;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--dim);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0;
    }

    .theme-toggle svg {
      width: 17px;
      height: 17px;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    [data-theme="light"] .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }

    .countdown {
      font-size: 12px;
      color: var(--dim);
      margin-top: 12px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--blue);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="verify-container">
    <div class="verify-card">
      <div class="verify-icon" id="icon">📧</div>
      <h1 class="verify-title">Verify Your Email</h1>
      <p class="verify-subtitle" id="subtitle">Check your email for a verification link or enter the token below</p>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>
      <div id="infoMessage" class="info-message"></div>

      <div id="verificationForm">
        <input 
          type="text" 
          id="verificationToken" 
          class="verify-input" 
          placeholder="Paste verification token here"
          autocomplete="off"
        >
        <button class="verify-button" id="verifyBtn" onclick="handleVerify()">Verify Email</button>
        
        <div style="text-align: center; font-size: 13px; color: var(--dim);">
          <a href="/login" class="verify-link">← Back to login</a>
        </div>
      </div>

      <div id="loadingMessage" style="display: none; text-align: center;">
        <div class="spinner"></div>
        <p style="color: var(--dim); margin: 8px 0 0 0;">Verifying email...</p>
      </div>

      <div id="completedMessage" style="display: none; text-align: center;">
        <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
        <p style="color: var(--green); font-weight: 600; margin: 0 0 12px 0;">Email verified!</p>
        <p style="color: var(--dim); margin: 0 0 16px 0;">Redirecting to your gym...</p>
      </div>

      <div class="countdown" id="countdown"></div>
    </div>
  </div>

  <script src="frontend.js"></script>
  <script>
    // Theme toggle
    function setupTheme() {
      let theme = localStorage.getItem('rr_theme');
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);

      document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('rr_theme', next);
      });
    }

    // Check if already logged in
    if (api.token) {
      window.location.href = '/gym-select';
    }

    // Get token from URL or localStorage
    function getVerificationToken() {
      const params = new URLSearchParams(window.location.search);
      const urlToken = params.get('token');
      if (urlToken) return urlToken;
      return localStorage.getItem('rr_verificationToken') || '';
    }

    async function handleVerify() {
      const token = document.getElementById('verificationToken').value.trim();
      const errorEl = document.getElementById('errorMessage');
      const successEl = document.getElementById('successMessage');
      const btn = document.getElementById('verifyBtn');

      errorEl.classList.remove('show');
      successEl.classList.remove('show');

      if (!token) {
        errorEl.textContent = 'Please enter a verification token';
        errorEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      document.getElementById('verificationForm').style.display = 'none';
      document.getElementById('loadingMessage').style.display = 'block';

      try {
        const result = await api.verifyEmail(token);
        
        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('completedMessage').style.display = 'block';

        // Redirect after 2 seconds
        setTimeout(() => {
          window.location.href = '/gym-select';
        }, 2000);
      } catch (err) {
        document.getElementById('verificationForm').style.display = 'block';
        document.getElementById('loadingMessage').style.display = 'none';
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
        btn.disabled = false;
      }
    }

    // If token in URL, auto-verify
    function autoVerifyIfToken() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (token) {
        document.getElementById('verificationToken').value = token;
        setTimeout(handleVerify, 500);
      }
    }

    // Handle Enter key
    document.getElementById('verificationToken').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleVerify();
    });

    setupTheme();
    autoVerifyIfToken();
  </script>
</body>
</html>
